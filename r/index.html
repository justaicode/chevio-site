<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A recipe shared with you — Chevio</title>
<meta name="description" content="Someone shared a recipe with you from Chevio — the calorie and macro tracker built around cooking.">
<!-- The page is static, so link-preview crawlers (WhatsApp, Messenger) never run
     the fetch below and can only see these generic tags. Serving /r/ from an
     edge function later would let each recipe have its own preview. -->
<meta property="og:title" content="A recipe shared with you">
<meta property="og:description" content="Open it in Chevio — calories and macros for food you actually cook.">
<meta property="og:site_name" content="Chevio">
<meta name="apple-itunes-app" content="app-id=PLACEHOLDER">
<style>
  :root { color-scheme: light dark; --bg:#f5f4f7; --card:#fff; --line:#eae7f0; --text:#1b1726; --muted:#928da0; --purple:#8671cb; --deep:#6b54b0; --pink:#f55a74; --yellow:#fec600; --soft:#ece9f6; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#131017; --card:#1c1824; --line:#2c2738; --text:#ece9f6; --muted:#8b84a0; --deep:#9a85d9; --soft:#241f30; } }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.6; color:var(--text); background:var(--bg); margin:0; }
  .wrap { max-width:680px; margin:0 auto; padding:0 20px 64px; }
  .nav { border-bottom:1px solid var(--line); }
  .nav-in { display:flex; align-items:center; gap:12px; height:64px; max-width:680px; margin:0 auto; padding:0 20px; }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--text); font-weight:800; letter-spacing:-0.3px; }
  .mark { width:32px; height:32px; border-radius:9px; background:#131017; display:flex; align-items:center; justify-content:center; }
  .eyebrow { color:var(--muted); font-size:13px; font-weight:700; letter-spacing:.4px; text-transform:uppercase; margin:30px 0 6px; }
  h1 { font-size:32px; line-height:1.14; letter-spacing:-0.8px; margin:0 0 8px; }
  .meta { color:var(--muted); font-size:15px; margin-bottom:20px; }
  .photo { width:100%; aspect-ratio:16/10; object-fit:cover; border-radius:18px; border:1px solid var(--line); background:linear-gradient(135deg,#efeaf9,#f7e6ec); display:block; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-top:16px; }
  .card h2 { font-size:15px; margin:0 0 12px; letter-spacing:.3px; text-transform:uppercase; color:var(--muted); }
  .macros { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; text-align:center; }
  .macros div b { display:block; font-size:19px; }
  .macros div span { font-size:12px; color:var(--muted); }
  ul.ing { list-style:none; margin:0; padding:0; }
  ul.ing li { display:flex; justify-content:space-between; gap:14px; padding:9px 0; border-top:1px solid var(--line); font-size:15px; }
  ul.ing li:first-child { border-top:0; }
  ul.ing li span { color:var(--muted); font-weight:600; white-space:nowrap; }
  ol.steps { margin:0; padding-left:20px; }
  ol.steps li { padding:5px 0; font-size:15px; }
  .sec { font-weight:800; font-size:13px; color:var(--deep); text-transform:uppercase; letter-spacing:.4px; padding-top:12px; }
  .cta { display:flex; align-items:center; gap:13px; background:#131017; color:#fff; border-radius:15px; padding:15px 18px; text-decoration:none; margin-top:22px; }
  .cta b { font-size:16px; display:block; }
  .cta span { font-size:13px; opacity:.72; }
  .cta .arw { margin-left:auto; opacity:.55; font-size:19px; }
  .note { color:var(--muted); font-size:13px; text-align:center; margin-top:14px; }
  .state { text-align:center; padding:80px 0; color:var(--muted); }
  .state h2 { color:var(--text); font-size:20px; margin:0 0 8px; }
  .skel { background:var(--line); border-radius:8px; height:15px; margin:9px 0; animation:p 1.2s ease-in-out infinite; }
  @keyframes p { 0%,100%{opacity:.55} 50%{opacity:.95} }
  a.plain { color:var(--deep); }
</style>
</head>
<body>

<nav class="nav"><div class="nav-in">
  <a class="brand" href="/"><span class="mark" aria-hidden="true"><svg viewBox="0 0 100 100" width="23" height="23"><circle cx="50" cy="50" r="30" fill="none" stroke="#8671CB" stroke-width="13" stroke-dasharray="62.83 125.66" transform="rotate(-90 50 50)"/><circle cx="50" cy="50" r="30" fill="none" stroke="#F55A74" stroke-width="13" stroke-dasharray="62.83 125.66" stroke-dashoffset="-62.83" transform="rotate(-90 50 50)"/><circle cx="50" cy="50" r="30" fill="none" stroke="#FEC600" stroke-width="13" stroke-dasharray="62.83 125.66" stroke-dashoffset="-125.66" transform="rotate(-90 50 50)"/><path d="M50 35 C51.4 45.2 54.8 48.6 65 50 C54.8 51.4 51.4 54.8 50 65 C48.6 54.8 45.2 51.4 35 50 C45.2 48.6 48.6 45.2 50 35 Z" fill="#fff"/></svg></span>Chevio</a>
</div></nav>

<div class="wrap" id="root">
  <div class="eyebrow">Shared recipe</div>
  <div class="skel" style="height:34px;width:70%"></div>
  <div class="skel" style="width:45%"></div>
  <div class="skel" style="height:210px;margin-top:18px"></div>
</div>

<script>
const SUPABASE_URL = "https://qkijkztyrdibcpdgpivi.supabase.co";
// Publishable key. It is meant to be public — the same key ships inside the iOS
// app — and row-level security is what actually protects the data: this key can
// read a share that has not been revoked, and can write nothing at all.
const SUPABASE_KEY = "sb_publishable_4_OWSchpJbtgbc9ef0Na0g_la7h0Fxo";

const APP_STORE_URL = "https://apps.apple.com/app/chevio/id0000000000"; // TODO: real id once the app is live
const root = document.getElementById("root");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const idOf = () => new URLSearchParams(location.search).get("id") || location.hash.replace(/^#/, "");

function amount(it) {
  // Mirrors the app: the serving label carries the unit size, quantity how many.
  const m = /^\s*([\d.,]+)\s*(.*)$/.exec(it.servingLabel || "");
  const base = m ? parseFloat(m[1].replace(",", ".")) : NaN;
  const unit = (m && m[2] || "").trim();
  const q = it.quantity || 1;
  if (isFinite(base) && base > 0 && unit) return Math.round(base * q) + " " + unit;
  return (q % 1 === 0 ? q : q.toFixed(2)) + " x " + (it.servingLabel || "");
}

function totals(r) {
  const t = { calories: 0, protein: 0, carbs: 0, fat: 0 };
  for (const it of r.ingredients || []) {
    // perServing is the nutrition of ONE serving-label unit; quantity is how
    // many of them. Same arithmetic the app uses in entryTotal.
    const p = it.perServing || {};
    t.calories += (p.calories || 0) * (it.quantity || 1);
    t.protein  += (p.protein  || 0) * (it.quantity || 1);
    t.carbs    += (p.carbs    || 0) * (it.quantity || 1);
    t.fat      += (p.fat      || 0) * (it.quantity || 1);
  }
  const s = Math.max(1, r.servings || 1);
  return { calories: Math.round(t.calories / s), protein: Math.round(t.protein / s), carbs: Math.round(t.carbs / s), fat: Math.round(t.fat / s) };
}

function render(r) {
  const per = totals(r);
  const bits = [];
  if (r.servings) bits.push(r.servings + (r.servings === 1 ? " serving" : " servings"));
  if (r.minutes) bits.push(r.minutes + " min");
  if (per.calories) bits.push(per.calories + " kcal per serving");

  let ings = "";
  let lastSec = null;
  (r.ingredients || []).forEach((it, i) => {
    const sec = (r.ingredientSections || [])[i] || "";
    if (sec && sec !== lastSec) { ings += '<li class="sec">' + esc(sec) + "</li>"; lastSec = sec; }
    ings += "<li>" + esc(it.name) + "<span>" + esc(amount(it)) + "</span></li>";
  });

  const steps = (r.steps || []).map((s) => "<li>" + esc(typeof s === "string" ? s : (s && s.text) || "") + "</li>").join("");

  root.innerHTML =
    '<div class="eyebrow">Shared recipe</div>' +
    "<h1>" + esc(r.title || "Recipe") + "</h1>" +
    '<div class="meta">' + esc(bits.join(" \u00b7 ")) + "</div>" +
    (r.photoUri ? '<img class="photo" alt="" src="' + esc(r.photoUri) + '">' : '<div class="photo"></div>') +
    (per.calories ? '<div class="card"><h2>Per serving</h2><div class="macros">' +
      "<div><b>" + per.calories + "</b><span>kcal</span></div>" +
      '<div><b style="color:var(--yellow)">' + per.protein + "g</b><span>protein</span></div>" +
      '<div><b style="color:var(--purple)">' + per.carbs + "g</b><span>carbs</span></div>" +
      '<div><b style="color:var(--pink)">' + per.fat + "g</b><span>fat</span></div>" +
      "</div></div>" : "") +
    (ings ? '<div class="card"><h2>Ingredients</h2><ul class="ing">' + ings + "</ul></div>" : "") +
    (steps ? '<div class="card"><h2>Method</h2><ol class="steps">' + steps + "</ol></div>" : "") +
    '<a class="cta" href="' + APP_STORE_URL + '"><span>' + "" + "</span><span><b>Open in Chevio</b>" +
      "<span>Free on the App Store</span></span><span class=\"arw\">&rsaquo;</span></a>" +
    '<p class="note">Chevio counts the food you cook \u2014 add this recipe and it logs in one tap.</p>';

  document.title = (r.title || "Recipe") + " — shared via Chevio";
}

function fail(title, body) {
  root.innerHTML = '<div class="state"><h2>' + esc(title) + "</h2><p>" + body + "</p>" +
    '<p><a class="plain" href="/">Go to chevio.app</a></p></div>';
}

(async () => {
  const id = idOf();
  if (!id) return fail("No recipe in this link", "The link looks incomplete \u2014 ask for it again.");
  try {
    const res = await fetch(
      SUPABASE_URL + "/rest/v1/shared_recipes?select=recipe&revoked=eq.false&id=eq." + encodeURIComponent(id),
      { headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY } }
    );
    if (!res.ok) throw new Error(String(res.status));
    const rows = await res.json();
    if (!rows.length || !rows[0].recipe) {
      return fail("This recipe isn\u2019t available", "The link may have expired, or the person who shared it stopped sharing.");
    }
    render(rows[0].recipe);
  } catch (e) {
    fail("Couldn\u2019t load the recipe", "Check your connection and try again.");
  }
})();
</script>
</body>
</html>
